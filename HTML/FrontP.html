<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.N.U.S - Saņemšanas & Nodošanas Uzskaites Sistēma</title>
    <link rel="stylesheet" href="FrontP.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>S.N.U.S</h1>
            <p>SAŅEMŠANAS & NODOŠANAS UZSKAITES SISTĒMA</p>
        </header>

        <div class="top-controls">
            <div class="control-box date-box">Datums</div>
            <div class="right-controls">
                <div class="control-box">Filtrs</div>
                <div class="control-box">Pierakstīties</div>
            </div>
        </div>

        <div class="info-bar">
            Pirmdiena
        </div>

        <div class="records-list">
            
            <div class="record-row">
                <div class="data-box">Kabinets</div>
                <div class="data-box">Lietotājs</div>
                <div class="data-box">Paņēma: </div>
                <div class="status-ind green">
                    <span class="status-txt">Pieejams</span>
                </div>
                <div class="data-box">Nodeva: </div>
            </div>

            <div class="record-row">
                <div class="data-box">Kabinets</div>
                <div class="data-box">Lietotājs</div>
                <div class="data-box">Paņēma 8:30</div>
                <div class="status-ind red">
                    <span class="status-txt">Aizņemts</span>
                </div>
                <div class="data-box">Nodeva: 00:00</div>
            </div>

            <div class="record-row">
                <div class="data-box">Kabinets</div>
                <div class="data-box">Lietotājs</div>
                <div class="data-box">Paņēma: </div>
                <div class="status-ind green">
                    <span class="status-txt">Pieejams</span>
                </div>
                <div class="data-box">Nodeva: </div>
            </div>

        </div>
    </div>
</body>
</html>
